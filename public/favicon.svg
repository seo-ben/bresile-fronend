<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="iconGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="iconBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#047857" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Fond Losange Brésilien -->
  <rect x="22" y="22" width="76" height="76" rx="22" 
        transform="rotate(45 60 60)" 
        fill="url(#iconGreen)" 
        filter="url(#iconShadow)" />

  <!-- Disque Bleu Nuit -->
  <circle cx="60" cy="60" r="30" fill="url(#iconBlue)" opacity="0.95" />

  <!-- Arc Solaire d'Or -->
  <path d="M 37 65 Q 60 52 83 65" 
        stroke="url(#iconGold)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        fill="none" />

  <!-- Livre Ouvert & Ailes d'Envol -->
  <path d="M 60 74 C 54 67, 45 65, 39 66 C 41 57, 50 55, 59 60 Z" fill="#FFFFFF" opacity="0.95" />
  <path d="M 60 74 C 66 67, 75 65, 81 66 C 79 57, 70 55, 61 60 Z" fill="#FFFFFF" opacity="0.95" />

  <!-- Étoile Guide -->
  <circle cx="60" cy="45" r="3.5" fill="url(#iconGold)" />
</svg>
